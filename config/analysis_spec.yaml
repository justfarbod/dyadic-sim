# Frozen exploratory analysis specification, v1 (2026-08-13).
#
# Fixed BEFORE rerunning design01 and power01 through the rebuilt pipeline, so
# the reanalysis reports what the spec says rather than what the data suggests
# afterwards. `analysis/validation/spec.py` reads this file; the rationale and
# the honest caveats are in `manuscript/ANALYSIS_SPEC.md`.
#
# ⚠ This hierarchy and these thresholds were chosen AFTER examining design01 and
# power01. That is acceptable for development and it is not a confirmatory
# specification. Anything claiming confirmation must fix its spec before the
# data exist.

version: v1
dated: "2026-08-13"
status: exploratory

# ---------------------------------------------------------------------------
# Instrument hierarchy. Ordered by how much weight a claim may rest on.
# ---------------------------------------------------------------------------
instruments:
  - id: lexicon
    role: primary
    why: >
      Auditable sentence by sentence, so every firing can be read back to the
      words that caused it. Independently reproduced by MADRS-BERT on the one
      convergent cell. The embedding cannot be checked this way and has r ~ 0.01
      convergent validity against it at session level.
  - id: embedding
    role: convergent
    why: >
      Generalises past a finite term list, which the exemplar saturation result
      says matters: two independent 100-exemplar samples of one symptom share
      about a sixth of their phrasing. Used as corroboration, never alone.
  - id: madrs_bert
    role: external
    why: >
      Shares no code with either, so agreement is not a shared-implementation
      artifact. Available only where its topics map to the injected symptom.
  - id: human
    role: validation_target
    why: >
      Not yet available. Until it exists, "the lexicon found 19%" is a statement
      about the lexicon.

# ---------------------------------------------------------------------------
# Fixed analysis parameters. Each was shown to move results, so each is pinned.
# ---------------------------------------------------------------------------
parameters:
  unit: bounded-turn        # guarantees coverage; `turn`/`session` truncate
  unit_agg: max             # historical; top2/top3 reported as sensitivity
  reference_agg: mean       # `max` saturates at 85 references per symptom
  references: expanded      # single reported as sensitivity
  clean_text: true
  confirmations: true       # off reported as sensitivity
  qc_view: all              # never silently exclude
  min_turns: 1              # recurrence measured, not gated

estimand:
  contrast: matched_control_per_case_equal_weight
  description: >
    One contrast per case (injected minus that case's own controls), pooled
    across cases with equal weights, so a case with more controls cannot
    dominate.
  interval: bootstrap_percentile_95
  resampling_unit: session_within_case_and_condition
  bounds: asymmetric        # store actual lo/hi, never a symmetric half-width
  effect_size: cohens_d
  scope_limit: >
    Only sessions are resampled, so intervals are conditional on the observed
    cases. They do NOT estimate generalisation to new patient cases. power01 has
    one case and one model pair, where case-level generalisation is not
    estimable at all.

# ---------------------------------------------------------------------------
# Sensitivities. Declared here so running them is obligatory rather than
# optional, and so a result that survives only one configuration is visible.
# ---------------------------------------------------------------------------
sensitivities:
  - id: unit_agg
    values: [max, top2, top3]
    why: max grows with unit count, and arms are not balanced on it
  - id: references
    values: [expanded, single]
    why: whether the exemplar pools mattered at all
  - id: confirmations
    values: [true, false]
    why: confirmation infers the symptom from the therapist's question
  - id: qc_view
    values: [all, drop-flagged-turns, drop-flagged-sessions]
    why: whether flagged generations carry the result
  - id: crisis_terminated
    values: [include, exclude]
    why: >
      Designed early termination, not failure. Shorter sessions score lower
      under max-over-units, and the arms are unbalanced (power01: 3 sleep,
      2 psychomotor, 1 control), so the imbalance biases against the injected
      arms rather than for them.
  - id: unit
    values: [bounded-turn, turn]
    why: quantifies what truncation was costing

# ---------------------------------------------------------------------------
# What counts as evidence. NOT p < .05.
# ---------------------------------------------------------------------------
criteria:
  magnitude:
    lexicon_lift_pp: 10.0
    embedding_cohens_d: 0.4
    why: >
      A detectable difference that is too small to matter is not a finding.
      Both instruments must clear their own bar.
  specificity:
    max_leak_pp: 5.0
    why: >
      The target detector must not rise in an arm where a DIFFERENT symptom was
      injected. This is the criterion that separates a symptom-specific effect
      from a generic "something was injected" response, and it is the one a
      p-value cannot express.
  direction:
    require_same_sign: true
    why: instruments disagreeing in sign is not convergence
  p_values:
    role: descriptive
    why: >
      The analysis was specified after seeing design01, so p-values describe the
      data rather than testing a prior hypothesis. Reported, never decisive.

# Worked against power01 when the thresholds were set. Recorded so the
# calibration is visible rather than implied.
calibration_note: >
  Under these criteria sleep_problems passes all three (lift +14pp, leak +0pp,
  d=0.65) and psychomotor_changes fails two (lift +17pp PASSES, leak +6pp fails,
  d=0.11 fails). Psychomotor has the LARGER lexicon lift, so a magnitude-only
  rule would have admitted it. That is the argument for the criteria being
  conjunctive.
