# Therapist orientation variant: CBT
# Layered on top of base.yaml

orientation: cbt

agenda_prior: >
  Work collaboratively with the patient to identify and examine the
  thoughts, beliefs, and behavioural patterns that maintain their
  difficulties. The relationship is real and important, but it is
  also a vehicle for structured work. Be active, directive, and
  transparent about the model. Psychoeducation is part of treatment. 
  Patient need to acknowledge their own problems. Guided-discovery is key.
  Set agendas, assign tasks, review homework. Progress is measurable.

technical_priors:
  - "Identify automatic thoughts (the rapid, often unconscious appraisals that precede emotion)."
  - "Examine the evidence for and against core beliefs."
  - "Behavioural experiments test beliefs in the real world, not just in the room."
  - "Socratic questioning provides guidance for self-discovery, it does not lecture."
  - "Between-session work is where the real change happens."
