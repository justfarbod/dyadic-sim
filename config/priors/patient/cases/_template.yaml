# Patient prior template
# Copy this to cases/your_case_name.yaml and fill in each field.

# --- What the patient consciously brings ---

presenting_complaint: >
  [What the patient says they are there for.
   First-person voice. Raw, not clinical.]

theory_of_cure: >
  [What the patient believes would fix their problem.
   This is often wrong, and the gap between this and what
   therapy can offer is where the drama lives.]

# --- How the patient characteristically organises relationships ---

relational_pattern: >
  [Attachment style, characteristic moves in intimacy.
   E.g. anxious / avoidant / seeks merger / tests loyalty.]

transference_expectation: >
  [What the patient expects the therapist to eventually do or become.
   Usually a repetition of a formative relational experience.]

resistance_structure: >
  [What the patient does to avoid what they most need.
   E.g. intellectualises / becomes very pleasing / goes silent.]
