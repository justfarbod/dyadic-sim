# What each experimental arm is SUPPOSED to contain.
#
# Written so that "is this corpus complete" and "is this session meant to be
# here" are answerable without reading the sessions and deciding afterwards. The
# audit's objection to design01's 41st session was not that an extra control is
# harmful - equal-case weighting absorbs it - but that no rule said in advance
# whether it belonged. A rule chosen after seeing its effect is not a rule.
#
# `inclusion` is the policy, stated prospectively:
#   all_valid   every completed run counts, including runs beyond `runs`
#   first_n     only runs 1..runs belong; later runs are extras to report
#
# Cells present but not listed here produce a visible warning, never silent
# inclusion.
#
# This file describes the arms that are LIVE in the working tree. An arm whose
# sessions have been archived is removed from here and its declaration travels
# with its data, so the two cannot drift apart:
#
#   design01   archived 2026-08-13. 2 cases x 4 conditions x 5 runs, the pilot
#              that selected sleep_problems for power01 - and whose own sleep
#              result later failed on specificity at n=63.
#              declaration -> _archive/design01_declaration.yaml
#              sessions    -> _archive/sessions_2026-08-13/design01/
#              results     -> _archive/results_2026-08-13/design01{,_madrs}/
#
# The declaration is kept rather than deleted because it was written BEFORE the
# sessions existed, which is the only thing that makes its inclusion rule worth
# anything.

bedcheck02:
  description: >
    Bed validation, second wording. The control arm of `no_complaint` after the
    2026-08-14 rewrite that removed its apologetic stance, and nothing else.
    Separate prefix from bedcheck01 because the case text changed: those 64
    sessions were generated from a different prior and are not interchangeable
    with these, however similar the file looks.
  cases: [no_complaint]
  conditions: [no_symptoms]
  runs: 64
  therapist_model: mistral-nemo
  patient_model: mistral-nemo
  generation_version: 3
  hazard_monitor: observe_only
  injection: active_only        # moot for a control arm; matched to power01
  turns: 10
  inclusion: all_valid
  notes: >
    Read against bedcheck01, which is the same bed with the apologetic wording.
    The three rates to watch are the ones that flooded there:
    feelings_of_failure_or_guilt 28%, MADRS/Gedanken 23%, depressed_mood 22%,
    against afraid_of_dogs controls at 11%, 6% and 6%.

    The six domains that were already good there should not regress: Anspannung
    23% (afraid_of_dogs 78%), concentration_problems 8% (30%),
    lack_of_pleasure 3% (16%), sleep 5%, low_energy 2%, appetite 2%, Suizid 0%.
    A rewrite that fixes guilt by breaking one of those is not an improvement.

bedcheck01:
  description: >
    Bed validation, FIRST wording of `no_complaint` - superseded by bedcheck02
    and kept as the evidence for why the case was rewritten. Control arm only.
    Do NOT pool with bedcheck02: the case text differs, so the two arms are not
    interchangeable.

    What it showed: term-clean by the prior lint and still flooding, because the
    flood came from stance rather than vocabulary. feelings_of_failure_or_guilt
    28%, MADRS/Gedanken 23%, depressed_mood 22% - against afraid_of_dogs
    controls at 11%, 6%, 6%. Six other domains were the best in the set. That
    split is what made a rewrite worth 3 hours rather than abandoning the bed.
  cases: [no_complaint]
  conditions: [no_symptoms]
  runs: 64
  therapist_model: mistral-nemo
  patient_model: mistral-nemo
  generation_version: 3
  hazard_monitor: observe_only
  injection: active_only        # moot for a control arm; matched to power01
  turns: 10
  inclusion: all_valid
  notes: >
    Read as base rates, one per symptom, across both panels. Low everywhere and
    `no_complaint` becomes the null bed the project has never had; one domain
    flooding and it does not, which is the same failure `feeling_off` had and
    the reason this arm is generated before any injected cell.

    The prior is already clean at the lexicon level - tests/test_case_priors.py
    asserts no detector fires on the case text itself, which is what
    `feeling_off` would have failed on "not myself". That is necessary and NOT
    sufficient: the prior can be clean and the model still drift into symptom
    talk unprompted, which is exactly what this arm measures and no static check
    can.

    Success is not "zero detections". Some vocabulary appears in any therapy
    transcript. Success is base rates low enough to leave headroom, and
    comparable across all nine rather than one domain saturating.

    n=64 to match power01, so that if the bed validates these sessions ARE the
    control arm of its grid rather than a throwaway. At 100 the surplus 36 would
    sit outside the declared design and be reported as extra runs forever. The
    precision given up is negligible for the question being asked: on a 5% base
    rate the interval widens from [2.2, 11.2] to [1.6, 12.9], which does not
    change whether a domain is judged to be flooding.

power01:
  description: >
    The active corpus. `power01` is a historical identifier, not a description:
    it was named for a powered test of one cell and has since become the base
    corpus. It is not renamed because the prefix is written into every session's
    case_name, so renaming would rewrite raw data and orphan every fingerprint
    and archived record. Read it as a batch number.
  cases: [afraid_of_dogs]
  conditions:
    - no_symptoms
    - depressed_mood
    - lack_of_pleasure
    - sleep_problems
    - low_energy
    - appetite_changes
    - feelings_of_failure_or_guilt
    - concentration_problems
    - psychomotor_changes
    - thoughts_of_death_or_self_harm
  runs: 64
  therapist_model: mistral-nemo
  patient_model: mistral-nemo
  generation_version: 3
  hazard_monitor: observe_only
  injection: active_only
  turns: 10
  inclusion: all_valid
  notes: >
    The psychomotor_changes arm was not part of the preregistered design and is
    exploratory. It shares the same 63 controls as the sleep arm, which is what
    makes the specificity comparison possible.
  amendments:
    - date: "2026-08-13"
      change: added depressed_mood as a fourth condition (63 runs, reusing the
        existing 63 controls)
      reason: >
        Declared BEFORE the sessions were generated. Three purposes: structural
        parity with design01, which already has this condition; a third
        independent specificity check for sleep_problems, whose clean +0.0pp
        leak is currently measured against psychomotor alone; and a cell where
        the two instruments contradict each other on design01 (lexicon -5.5pp
        against embedding +0.36, d=0.64) at an n that cannot resolve it.
        Controls are reused rather than regenerated, matching how design01 is
        built. The control side is therefore not fresh, which is recorded rather
        than glossed.
    - date: "2026-08-14"
      change: >
        Extended to the full PHQ-9 grid - all nine symptoms plus the control -
        at 64 runs per cell. Declared here before any of the new sessions were
        generated.
      reason: >
        Four conditions were enough to ask whether a single cell separates from
        its control, and that question has been answered as far as this design
        can answer it. The open questions are now comparative and need the other
        five symptoms: enactment fidelity measured for sleep (19%) and depressed
        mood (9.5%) is uninterpretable without knowing what the remaining
        symptoms do, and detector precision measured on two symptoms (92% and
        37%) cannot say whether the difference is about concrete versus
        metaphorical vocabulary or about those two words in particular.

        n=64 rather than deeper. The powered estimate for the observed effect
        sizes was 33-44 per group, so 64 clears it with margin for exclusions,
        and the arms are already at 60-62 so the existing corpus is nearly
        there. Depth beyond this buys precision the design does not need; the
        binding limitation is that every interval is conditional on ONE case,
        which no amount of n inside that case can fix. The compute saved goes to
        more beds instead.
    - date: "2026-08-14"
      change: >
        The hazard monitor no longer stops a session; it detects and records
        only. Seven sessions truncated by the old behaviour were archived to
        _archive/sessions_2026-08-13/power01_crisis_truncated/ and are replaced
        by the top-up rather than regenerated at their original run numbers.
      reason: >
        Every crisis pause in the corpus was a false positive of bare substring
        matching - four of seven on "end it" inside the word "pretend it" - and
        each one silently cut a session short, so the truncation read as data.
        This does NOT split the corpus. The monitor only alters a transcript
        when it fires, so for the 245 sessions where it never fired the change
        is unobservable; once the seven are replaced the whole corpus is
        indistinguishable from one generated with pausing disabled. Recorded as
        `hazard_monitor` rather than a generation_version bump for that reason:
        the version marks corpora that cannot be compared, and these can.
    - date: "2026-08-14"
      change: >
        Pending decision, recorded before generation: thoughts_of_death_or_self_harm
        is one of the six new cells and will be generated with the monitor in
        observe-only mode.
      reason: >
        It is the one condition the pause was meant for. No person is at risk -
        the patient is a language model and the text is synthetic - and item 9
        has historically almost never fired, so the expected yield is low. But
        ~100 sessions deliberately prompting a simulated patient toward death or
        self-harm ideation needs a content note and a data-use statement if this
        corpus is deposited, and that is a decision to take deliberately rather
        than arrive at.
